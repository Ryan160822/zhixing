services:
  zxgk-query:
    build:
      context: .
    image: zxgk-query:latest
    container_name: zxgk-query
    restart: unless-stopped
    ports:
      - "8765:8765"
    environment:
      ZXGK_HOST: 0.0.0.0
      ZXGK_PORT: 8765
    volumes:
      - ./results:/app/results
      - ./.runtime:/app/.runtime
